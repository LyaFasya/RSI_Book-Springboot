<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pinjam Buku</title>
</head>
<body>

<nav>
    <a th:href="@{/buku}">Daftar Buku</a> |
    <a th:href="@{/anggota}">Daftar Anggota</a> |
    <a th:href="@{/pinjam}">Pinjam Buku</a>
</nav>

<h1>Pinjam Buku</h1>

<!-- Pemilihan anggota untuk simulasi session -->
<form th:action="@{/pinjam/anggota}" method="post">
    <label for="idAnggota">Pilih Anggota:</label>

    <select id="idAnggota" name="idAnggota" required>
        <option value="">-- Pilih anggota --</option>

        <option th:each="a : ${daftarAnggota}"
                th:value="${a.idAnggota}"
                th:text="${a.idAnggota + ' - ' + a.nama}"
                th:selected="${a.idAnggota == idAnggota}">
        </option>
    </select>

    <button type="submit">Gunakan Anggota</button>
</form>

<p>
    Anggota aktif:
    <b th:text="${idAnggota != null ? idAnggota : 'Belum dipilih'}">
        Belum dipilih
    </b>
</p>

<!-- Pesan ketika peminjaman gagal -->
<div th:if="${pesan}" role="alert" style="color: #b00020;">
    <p th:text="${pesan}"></p>

    <a th:if="${bisaReservasi == true}"
       th:href="@{/reservasi(idBuku=${idBukuReservasi})}">
        Ajukan Reservasi
    </a>
</div>

<table border="1">
    <tr>
        <th>ID Buku</th>
        <th>Judul</th>
        <th>Stok</th>
        <th>Aksi</th>
    </tr>

    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}"></td>
        <td th:text="${b.judul}"></td>
        <td th:text="${b.stok}"></td>

        <td>
            <form th:action="@{/pinjam}" method="post">
                <input type="hidden"
                       name="idBuku"
                       th:value="${b.idBuku}">

                <button type="submit"
                        th:disabled="${idAnggota == null}">
                    Pinjam
                </button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
