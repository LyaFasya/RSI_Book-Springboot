<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Buku</title>
</head>
<body>

<h1>Tambah Buku</h1>

<form th:action="@{/buku}" method="post">
    <p>
        <label for="idBuku">ID Buku</label><br>
        <input id="idBuku"
               name="idBuku"
               maxlength="10"
               required>
    </p>

    <p>
        <label for="judul">Judul</label><br>
        <input id="judul"
               name="judul"
               maxlength="200"
               required>
    </p>

    <p>
        <label for="stok">Stok</label><br>
        <input id="stok"
               name="stok"
               type="number"
               min="0"
               value="1"
               required>
    </p>

    <button type="submit">Simpan</button>
    <a th:href="@{/buku}">Batal</a>
</form>

</body>
</html>
