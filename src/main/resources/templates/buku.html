<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku</title>
</head>
<body>

<nav>
    <a th:href="@{/buku}">Daftar Buku</a> |
    <a th:href="@{/anggota}">Daftar Anggota</a>
</nav>

<h1>Daftar Buku</h1>
<form th:action="@{/buku}" method="get">
    <input name="kata"
           th:value="${kata}"
           placeholder="Cari judul">

    <button type="submit">Cari</button>
</form>
<p>
    <a th:href="@{/buku/tambah}">Tambah Buku</a>
</p>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Judul</th>
        <th>Stok</th>
    </tr>

    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}"></td>
        <td th:text="${b.judul}"></td>
        <td th:text="${b.stok}"></td>
    </tr>
</table>

</body>
</html>
